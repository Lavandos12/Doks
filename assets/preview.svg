<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10"/>
      <stop offset="50%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#151226"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#3b3363" opacity="0.45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <circle cx="350" cy="220" r="280" fill="#7c3aed" opacity="0.12" filter="blur(60px)"/>
  <circle cx="900" cy="400" r="260" fill="#3b82f6" opacity="0.10" filter="blur(60px)"/>

  <!-- Top Floating Miro Island Bar -->
  <g transform="translate(60, 36)" filter="url(#shadow)">
    <rect width="360" height="46" rx="14" fill="#141724" fill-opacity="0.85" stroke="#2d324d" stroke-width="1"/>
    <rect x="12" y="10" width="26" height="26" rx="8" fill="#7c3aed"/>
    <text x="25" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">🐱</text>
    <text x="48" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Doks</text>
    <text x="88" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">/ Sprint Architecture</text>
    <rect x="254" y="11" width="94" height="24" rx="6" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1"/>
    <circle cx="266" cy="23" r="4" fill="#34d399"/>
    <text x="276" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">Live Sync</text>
  </g>

  <!-- Left Floating Creation Dock -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect width="48" height="300" rx="16" fill="#141724" fill-opacity="0.85" stroke="#2d324d" stroke-width="1"/>
    <circle cx="24" cy="34" r="14" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="24" y="39" font-family="sans-serif" font-size="14" fill="#c084fc" text-anchor="middle">✦</text>
    <text x="24" y="86" font-family="sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">📝</text>
    <text x="24" y="134" font-family="sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">▢</text>
    <text x="24" y="182" font-family="sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">➔</text>
    <text x="24" y="230" font-family="sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">📎</text>
    <text x="24" y="276" font-family="sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">⚡</text>
  </g>

  <!-- Connectors -->
  <path d="M 440 280 C 530 280, 560 380, 640 380" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="644,380 634,374 634,386" fill="#818cf8"/>

  <path d="M 870 380 C 940 380, 960 270, 1020 270" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 6" stroke-linecap="round"/>
  <polygon points="1024,270 1014,264 1014,276" fill="#34d399"/>

  <!-- Card 1: Obsidian Markdown Note -->
  <g transform="translate(180, 180)" filter="url(#shadow)">
    <rect width="260" height="200" rx="14" fill="#181b29" stroke="#333a56" stroke-width="1.5"/>
    <rect width="260" height="38" rx="14" fill="#1f2335"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">📄 Architecture [[Core]]</text>
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a78bfa">## Yjs CRDT Sync</text>
    <text x="16" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Zero-conflict peer updates</text>
    <text x="16" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• 60 FPS live pointer awareness</text>
    <text x="16" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">• Local-first IndexedDB cache</text>
    <rect x="16" y="152" width="90" height="22" rx="6" fill="#7c3aed" fill-opacity="0.2"/>
    <text x="61" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">#markdown</text>
  </g>

  <!-- Card 2: Interactive Miro Kanban Widget -->
  <g transform="translate(640, 260)" filter="url(#shadow)">
    <rect width="230" height="240" rx="14" fill="#181b29" stroke="#4f46e5" stroke-width="1.5"/>
    <rect width="230" height="36" rx="14" fill="#20243d"/>
    <text x="16" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#818cf8">📋 Sprint Backlog</text>
    
    <rect x="14" y="48" width="202" height="52" rx="8" fill="#fef08a"/>
    <text x="24" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#713f12">Cloudflare R2 Sync</text>
    <text x="24" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#854d0e">Automated state snapshots</text>

    <rect x="14" y="110" width="202" height="52" rx="8" fill="#bbf7d0"/>
    <text x="24" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#14532d">Northflank 1-Click</text>
    <text x="24" y="149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#166534">Always-on free sandbox</text>

    <rect x="14" y="172" width="202" height="52" rx="8" fill="#e9d5ff"/>
    <text x="24" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#581c87">Dynamic UUID Routing</text>
    <text x="24" y="211" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#6b21a8">Cryptographic board links</text>
  </g>

  <!-- Collaborative Live Cursor 1 (Alice) -->
  <g transform="translate(490, 310)">
    <polygon points="0,0 6,18 11,13 18,18 20,16 13,11 18,6" fill="#ec4899"/>
    <rect x="14" y="18" width="62" height="22" rx="6" fill="#ec4899"/>
    <text x="45" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Alice</text>
  </g>

  <!-- Collaborative Live Cursor 2 (Bob) -->
  <g transform="translate(930, 240)">
    <polygon points="0,0 6,18 11,13 18,18 20,16 13,11 18,6" fill="#3b82f6"/>
    <rect x="14" y="18" width="56" height="22" rx="6" fill="#3b82f6"/>
    <text x="42" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Bob</text>
  </g>
</svg>
