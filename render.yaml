services:
  - type: web
    name: doks
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DOKS_HOST
        value: 0.0.0.0
      - key: DOKS_DATA_DIR
        value: /app/data
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384 --expose-gc"
